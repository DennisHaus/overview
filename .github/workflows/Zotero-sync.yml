name: Sync writings from Zotero

on:
  schedule:
    - cron: '17 3 * * *'   # every night
  workflow_dispatch:         # and with "Run workflow" on the Actions tab

permissions:
  contents: write

concurrency:
  group: zotero-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read Zotero
        run: python scripts/zotero_sync.py
        env:
          ZOTERO_USER_ID: '18632873'
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_AUTHOR_FAMILY: 'Häusler'
          ZOTERO_AUTHOR_GIVEN: 'Dennis'

      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writings.json writings
          if git diff --staged --quiet; then
            echo 'Nothing changed in Zotero.'
          else
            git commit -m 'Sync writings from Zotero'
            git pull --rebase -X theirs origin main
            git push
          fi
