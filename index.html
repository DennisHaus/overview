<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Places · dennishaus</title>
  <meta name="description" content="All websites by dennishaus as preview panels and on a map of Europe.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>Places</h1>
      <p class="sub">Every website by dennishaus, as panels and on the map. Click a panel to open the site in a new tab.</p>
    </div>

    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="visually-hidden">Search websites</span>
        <input id="search" type="search" placeholder="Search names, places, countries" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </label>

      <label class="select">
        <span class="visually-hidden">Sort</span>
        <select id="sort">
          <option value="updated">Recently updated</option>
          <option value="name">Name A–Z</option>
          <option value="place">By place</option>
        </select>
      </label>

      <div class="views" role="group" aria-label="View">
        <button type="button" data-view="both" aria-pressed="true">Panels + map</button>
        <button type="button" data-view="panels" aria-pressed="false">Panels</button>
        <button type="button" data-view="map" aria-pressed="false">Map</button>
      </div>

      <label class="toggle">
        <input id="live" type="checkbox" checked>
        <span>Live previews</span>
      </label>
    </div>
  </header>

  <main id="layout" class="layout" data-view="both">
    <section id="panels" class="panels" aria-label="Websites">
      <p id="status" class="status" role="status"></p>
      <div id="grid" class="grid"></div>
    </section>

    <section class="mapwrap" aria-label="Map">
      <div id="map"></div>
      <p id="mapnote" class="mapnote" hidden></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
